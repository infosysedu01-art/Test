{% extends 'base.html' %}{% from '_macros.html' import head %}{% block title %}{{ _('Reset Password') }}{% endblock %}
{% block content %}
{% call head(_('Reset Password'), 'key') %}{% endcall %}
<form method="post" class="card border-0 shadow-sm" style="max-width:480px"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="card-body">
 <p class="mb-3">{{ _('Reset password for') }}: <b>{{ u.full_name }} ({{ u.username }})</b></p>
 <div class="mb-3"><label class="form-label">{{ _('New Password') }}</label><input type="text" class="form-control" name="new" id="np" required minlength="8" autocomplete="off"></div>
 <div class="mb-3"><label class="form-label">{{ _('Confirm New Password') }}</label><input type="text" class="form-control" name="confirm" id="cp" required minlength="8" autocomplete="off"></div>
 <button type="button" class="btn btn-sm btn-warning mb-3" id="gen"><i class="bi bi-shuffle me-1"></i>{{ _('Generate Password') }}</button>
 <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="must_change" value="1" id="mc" {{ 'checked' if u.id != current_user.id }}><label class="form-check-label" for="mc">{{ _('Ask the user to change the password at next login') }}</label></div>
 <button class="btn btn-success"><i class="bi bi-check2-circle me-1"></i>{{ _('Reset Password') }}</button> <a class="btn btn-light border" href="{{ url_for('users') }}">{{ _('Cancel') }}</a>
</div></form>
<script>
document.getElementById('gen').addEventListener('click',()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';const a=new Uint32Array(10);crypto.getRandomValues(a);
 const p=[...a].map(x=>c[x%c.length]).join('');document.getElementById('np').value=p;document.getElementById('cp').value=p;});
</script>{% endblock %}
