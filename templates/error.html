{% extends 'base.html' %}{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="text-center py-5"><div class="display-1 fw-bold text-primary">{{ code }}</div>
 <h1 class="h3 mb-2">{{ title }}</h1><p class="text-muted mb-4">{{ msg }}</p>
 <a class="btn btn-primary" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}"><i class="bi bi-house-door me-1"></i>{{ _('Dashboard') }}</a>
 <button class="btn btn-outline-secondary" onclick="history.back()"><i class="bi bi-arrow-left me-1"></i>{{ _('Back') }}</button></div>
{% endblock %}
